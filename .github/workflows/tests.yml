name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TURSO_DATABASE_URL: libsql://test.example.com
      TURSO_AUTH_TOKEN: test-token
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: test-key
      NASA_API_KEY: DEMO_KEY
      OTEL_SDK_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -v

  deploy:
    name: Deploy to Oracle Cloud
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-apod-production
      cancel-in-progress: false
    env:
      APP_PATH: /home/ubuntu/services/apod
      APP_PORT: "29401"
      SERVICE: cosmofy-apod
      PUBLIC_HEALTH_URL: https://apod.api.cosmofy.services.deployim.com/health/ready

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/apod_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/apod_deploy
          chmod 600 ~/.ssh/known_hosts

      - name: Rolling deployment
        run: |
          set -euo pipefail
          for host in 147.5.108.22 150.230.27.121; do
            ssh -i ~/.ssh/apod_deploy ubuntu@"$host" "mkdir -p '$APP_PATH'"
            rsync -az --delete \
              --exclude '.env' \
              --exclude '.git' \
              --exclude '.venv' \
              --exclude '.pytest_cache' \
              --exclude '__pycache__' \
              --exclude 'data' \
              -e 'ssh -i ~/.ssh/apod_deploy' \
              ./ ubuntu@"$host":"$APP_PATH/"
            ssh -i ~/.ssh/apod_deploy ubuntu@"$host" "
              set -euo pipefail
              cd '$APP_PATH'
              ~/.local/bin/uv sync --locked --no-dev
              sudo install -o root -g root -m 0644 deploy/cosmofy-apod.service /etc/systemd/system/cosmofy-apod.service
              sudo install -o root -g otelcol-contrib -m 0640 deploy/otel-collector.yaml /etc/otelcol-contrib/config.yaml
              sudo install -d -o otelcol-contrib -g otelcol-contrib -m 0750 /var/lib/otelcol-contrib/storage
              sudo install -d -o root -g root -m 0755 /etc/systemd/system/otelcol-contrib.service.d
              sudo install -o root -g root -m 0644 deploy/otelcol-contrib-override.conf /etc/systemd/system/otelcol-contrib.service.d/apod.conf
              sudo systemctl daemon-reload
              sudo systemctl enable cosmofy-apod.service
              sudo systemctl enable otelcol-contrib.service
              sudo systemctl restart otelcol-contrib.service
              for attempt in \$(seq 1 30); do
                if curl -fsS --max-time 5 'http://127.0.0.1:13133/' >/dev/null; then
                  break
                fi
                sleep 1
              done
              curl -fsS --max-time 5 'http://127.0.0.1:13133/' >/dev/null
              sudo systemctl restart cosmofy-apod.service
              for attempt in \$(seq 1 30); do
                if curl -fsS --max-time 5 'http://127.0.0.1:$APP_PORT/health/ready' >/dev/null; then
                  exit 0
                fi
                sleep 2
              done
              sudo journalctl -u cosmofy-apod.service -n 100 --no-pager
              exit 1
            "
          done

      - name: Verify load-balanced service
        run: curl -fsS --retry 5 --retry-all-errors --max-time 15 "$PUBLIC_HEALTH_URL"
